# 复制为 config.yaml 后修改。采集、弹幕、私信、写操作限制及代理门禁等常用参数也可在「设置 → 采集与运行」调整；页面保存项优先且重启后保留。
server:
  host: 127.0.0.1
  # 本地个人工作台默认免登录，仅接受本机回环地址访问。
  port: 8000

engine:
  scan_interval_seconds: 300      # 全局扫描间隔（1–86400 秒）；弹幕可跟随此值，其他监控单独设置
  worker_pool_size: 2             # 并发下载数(跨作品)
  scan_concurrency: 2             # 同时抓取的目标数(并发浏览器上下文)
  block_media_resources: false    # 屏蔽图片/视频/字体加载(省带宽但会打断抖音 SPA 致拿不到数据,建议保持 false)
  xhs_browser_mode: auto          # auto=优先每账号系统 Chrome CDP;cdp=严格 CDP;patchright=直接使用 Patchright
  resident_browser_sessions: true # reuse one account browser process/Profile/task page
  browser_session_idle_seconds: 1800 # idle recycle; 0=LRU/explicit close/shutdown only
  xhs_read_mode: api              # api=常驻Node签名直连（默认）;browser=复用账号浏览器
  rednote_read_mode: hybrid       # 海外小红书:hybrid=XYS/XYW+b1直连优先失败回退页面(默认推荐);api=仅直连;browser=仅页面
  douyin_read_mode: hybrid         # hybrid=API优先，普通兼容失败才回退浏览器；验证/风控直接冷却
  tiktok_read_mode: native         # native=全程离线直连、不打开浏览器;auto=失败页面回退;browser=仅页面
  bilibili_read_mode: hybrid       # hybrid=WBI直连优先、兼容失败回退浏览器;api=仅直连;browser=仅页面
  bilibili_write_mode: hybrid      # hybrid=CSRF/WBI直连优先(评论/私信/关注);api=仅直连;browser=仅页面
  instagram_read_mode: hybrid      # hybrid=Instagram双栈直连优先、兼容失败回退浏览器;api=仅直连;browser=仅页面
  instagram_write_mode: hybrid     # hybrid=SIGNATURE./Direct直连优先(评论/私信/关注/发布);api=仅直连;browser=仅页面
  twitter_read_mode: hybrid        # hybrid=GraphQL/Syndication/REST直连优先、兼容失败回退隔离浏览器;api=仅直连;browser=全程浏览器
  twitter_write_mode: browser      # X (Twitter) 写操作与发布统一走隔离浏览器原生签名通道
  facebook_read_mode: hybrid       # hybrid=SSR与动态GraphQL协议直采优先、冷启动或异常回退隔离浏览器;api=纯协议直连;browser=全程浏览器
  facebook_write_mode: browser     # Facebook 写操作与发布（个人/公共主页/群组/快拍）统一走隔离浏览器通道
  youtube_read_mode: hybrid        # hybrid=SSR(ytInitialData)与Innertube直采优先、兼容失败回退隔离浏览器;api=仅直连;browser=全程浏览器
  youtube_write_mode: browser      # YouTube 写操作（Studio发布、赞评、订阅与观看养号）统一走隔离浏览器通道
  douyin_profile_mode: hybrid      # 手动刷新资料:hybrid/API/browser
  douyin_followers_mode: hybrid    # 粉丝同步:hybrid/API/browser
  douyin_dm_sync_mode: hybrid      # 私信会话同步:hybrid/API/browser
  douyin_creator_danmaku_mode: hybrid # 本账号作品弹幕:hybrid/API/browser
  douyin_publish_mode: browser     # 发布当前仅 browser
  douyin_write_mode: browser       # browser=仅真机浏览器拟人操作(默认推荐,防风控);hybrid=API优先失败回退页面;api=仅API
  xhs_keyword_gap_seconds: 10     # 同一任务相邻关键词的最小停顿
  xhs_item_gap_seconds: 2.5       # 相邻详情/评论读取的最小停顿
  xhs_request_jitter: 0.35        # 小红书读取停顿的正向随机抖动比例
  xhs_publish_mode: browser       # browser=页面发布;api=显式 API 兼容模式
  rednote_publish_mode: browser   # browser=创作者中心页面发布(默认);api=实验性 XYS+b1 纯协议直发通道
  xhs_dm_monitor_enabled: false   # 低频检查 Web 私信；首次只建立基线
  xhs_dm_poll_interval_seconds: 120
  xhs_dm_realtime_enabled: true   # 监听页面原生 WebSocket；推送只用于唤醒
  xhs_dm_realtime_debounce_seconds: 1.5
  xhs_dm_fallback_interval_seconds: 600
  xhs_dm_max_conversations_per_poll: 2
  xhs_dm_poll_jitter: 0           # 私信轮询随机错峰上限比例(0=关闭)
  xhs_dm_auto_reply_enabled: false # 开启后仍需创建并启用账号规则
  monitor_initial_backfill_count: 0  # 新增博主时回填最近 N 条;0=只下载订阅后的新作品,-1=尽可能全量
  comment_recent_works: 5         # 监控评论时,只看每个目标最近 N 条作品
  comment_recent_days: 7          # 且仅限最近多少天内发布的作品
  comment_max_scrolls: 6          # 评论区翻页深度(滚动容器次数,越大扫得越深)
  danmaku_recent_works: 5         # 弹幕监控账号模式默认扫描的近期作品数
  danmaku_recent_days: 7          # 弹幕监控账号模式默认作品时间范围
  danmaku_max_scrolls: 6          # 弹幕抓取默认翻页/加载轮次
  danmaku_probe_step_seconds: 1.0 # 播放页按视频时间轴探测的步长(秒)
  danmaku_max_probe_points: 120   # 单条视频最多探测的时间点数
  danmaku_max_records_per_scan: 1000 # 单轮最多入库弹幕数,0=不限
  danmaku_max_records_total: 0    # 每个监控最多保留记录数,0=不限
  account_check_interval_seconds: 1800   # 登录态独立体检与保活间隔(秒,0=关闭)；启动首轮检查，普通读取不延后
  keepalive_cookie_sync_enabled: true    # 体检/保活成功后自动将平台刷新的 Cookie 与会话态同步落库
  bilibili_auto_cookie_refresh: true     # B站检测到需续期时自动调用官方 RSA-OAEP 接口完成 Cookie 续期
  shipinhao_keepalive_interval_seconds: 900 # 微信视频号独立保活间隔(秒,0=跟随全局体检间隔)
  keepalive_notify_on_invalid: true      # 账号登录态由有效转为失效时通过已配置通知渠道推送离线提醒
  # 自有账号评论模式(创作中心)页面 URL —— 实验性,抖音改版/字段变了改这里
  creator_comment_url: https://creator.douyin.com/creator-micro/interaction/comment-management
  creator_danmaku_url: https://creator.douyin.com/creator-micro/interaction/danmaku-management
  request_timeout_seconds: 20
  douyin_captcha_wait_seconds: 300 # 浏览器模式等待人工验证；API风控直接冷却
  douyin_keyword_gap_seconds: 8    # 同一任务内相邻抖音关键词的停顿秒数
  download_timeout_seconds: 120
  media_dir: ./data/media         # 下载文件落地目录
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36

  # ── 多账号风控隔离 ──
  profiles_dir: ./data/profiles   # 每账号独立持久化浏览器 profile 根目录
  max_live_contexts: 6            # 同时常驻的浏览器 context 上限(LRU 驱逐,控内存;20+账号无需全开)
  browser_backend: local          # local=现有 Patchright/CDP;fingerprint_chromium=其他平台可选；小红书固定使用系统 Chrome/CDP
  fingerprint_chromium_path: ""   # 本机 chrome/chromium 主程序路径；也可用 CREATORHUB_FINGERPRINT_CHROMIUM_PATH
  fingerprint_chromium_root: ""   # 本机多内核扫描根目录；不同机器分别配置，不限定盘符；多目录可用环境变量 CREATORHUB_FINGERPRINT_CHROMIUM_ROOTS
  fingerprint_chromium_allow_headless: false # 上游无头画像不完整,默认所有指纹环境使用可见窗口
  fingerprint_chromium_platform: auto # auto=跟随宿主系统;也可指定 windows/linux/macos
  active_accounts: 3              # 同一时刻最多并发活跃的账号数(错峰,降低"多号同时活跃"特征)
  scan_jitter: 0                  # 扫描周期随机错峰比例(0=关闭;建议在「风控中心 → 风控规则」统一管理)
  initial_scan_spread_seconds: 0  # 新监控/评论规则首次自动执行错峰上限(秒,0=关闭)
  route_download_via_proxy: true  # 媒体下载是否走账号代理(避免 CDN 拉流暴露真实 IP)
  strict_proxy_required: false    # 兼容保留字段:默认仅提醒不强拦,允许本机直连
  forbid_same_platform_shared_proxy: false # 兼容保留字段:默认仅提醒不强拦,允许同平台复用代理
  verify_proxy_region: true       # 体检时探测代理出口国家,与账号时区(默认东八区)不一致则告警
  native_write_gate_enabled: false # 新建 native 账号写操作环境门禁(默认关闭,按需在风控规则中开启)
  native_write_require_system_chrome: true # 开启门禁后要求使用系统稳定版 Chrome
  native_write_require_verified_proxy: true # 开启门禁后已配代理的账号需先通过“测试”建立出口基线
  native_write_proxy_max_age_seconds: 86400 # 出口基线有效期;过期后需重新测试代理
  browser_exit_probe_url: https://ipinfo.io/json

  # ── 写操作基础限制(默认全部关闭/0=不限,建议在「风控中心 → 风控规则」统一开关与配置)──
  comment_daily_cap_per_account: 0     # 每账号每日自动评论总上限(0=不限)
  comment_hourly_cap_per_account: 0    # 每账号每小时自动评论上限(0=不限)
  comment_min_gap_seconds: 0           # 同账号两条评论全局最小间隔(秒,0=不限)
  comment_jitter: 0                    # 评论排队随机错峰比例(0=关闭)
  comment_risk_cooldown_seconds: 21600 # 平台拒绝/验证后暂停该账号写操作参考时长(默认6小时)
  xhs_comment_write_mode: browser      # browser=页面发布;api=显式兼容;manual=只保存草稿
  xhs_comment_review_before_publish: false # 全局强制保险锁:false=按各规则自身「发布前审核」开关决定;true=强制所有小红书评论先存草稿人工审核
  channels_read_mode: auto             # auto=优先桌面微信 Finder 原生协议,回退创作者助手;protocol=仅原生协议;browser=仅助手页面
  channels_cdp_endpoint: ""            # 可选:本机回环微信 Finder CDP 端点(如 http://127.0.0.1:9222)
  channels_cdp_endpoint_file: ""       # 可选:wmpf_cdp 生成的单会话本地回环端点描述文件路径
  channels_proxy_enabled: false        # 可选:启用内置本机视频号 HTTPS 代理桥接(配合普通版已登录桌面微信)
  channels_proxy_port: 2023            # 可选:内置视频号本机代理监听端口(127.0.0.1)
  action_daily_cap_per_account: 0      # 每账号每日写操作(关注/取关/私信)总上限(0=不限)
  action_hourly_cap_per_account: 0     # 每账号每小时写操作上限(0=不限)
  action_min_gap_seconds: 0            # 同账号两次写操作全局最小间隔(秒,0=不限)

  # ── 活跃时段(夜间静默与人类作息节律)—— 默认关闭，按需在「风控中心 → 风控规则」开启 ──
  quiet_hours_enabled: false       # 夜间静默总开关(默认关闭)
  quiet_hours_include_reads: false # 活跃时段外是否同步休眠后台定时监控、评论采集与登录态体检(默认关闭)
  quiet_hours_wake_jitter_minutes: 0 # 每账号每日独立随机苏醒/入睡偏移上限(0–120 分钟,0=关闭)
  active_hours_start: 8            # 活跃起点小时(含)
  active_hours_end: 24             # 活跃止点小时(不含);可 >24 跨零点(如 25=次日 1 点)

  # ── 本账号作品健康监控(盯自己作品的流量/0播/违规,异常推送通知)──
  #    默认关:开启后每 interval 用各账号登录态打开自己主页抓作品列表(较重),
  #    检测「发布满 N 小时仍 0 播」「状态含违规/下架」并推通知;顺带写每日粉丝/互动快照供「数据」视图。
  work_health_enabled: false            # 作品健康监控总开关
  work_health_interval_seconds: 3600    # 每个账号多久体检一次自己作品
  work_health_zero_play_hours: 6.0      # 发布满 N 小时仍 0 播即预警(仅对会报播放量的平台生效)
  work_health_recent_days: 7            # 只体检最近 N 天内发布的作品
  work_health_stat_snapshots: true      # 记录账号粉丝/作品/互动每日快照(「本账号→数据」趋势;不占额外抓取)

# 统一平台风控：默认全部关闭，任务按计划直接执行；可在「风控中心 → 风控规则」一键选择场景方案或按模块独立开启。
# mode: custom 表示所有参数所见即所得（不再暗中覆盖输入值）。
risk_control:
  enabled: false
  mode: custom
  cooldown_enabled: false        # 异常自动冷却与渐进恢复
  write_limits_enabled: false    # 写操作间隔与小时/每日额度保护
  pacing_enabled: false          # 读写防抖与连续操作自动休息
  network_guard_enabled: false   # 同出口并发控制与多号熔断
  jitter_enabled: false          # 自动任务随机错峰
  network_group_concurrency: 1   # 同出口防连坐开启时：同一代理/直连出口并发数
  read_light_gap_seconds: 15
  read_heavy_gap_seconds: 45
  operation_gap_min_seconds: 6   # 操作节奏开启时：账号跨功能操作最小间隔（秒）
  operation_gap_max_seconds: 18
  session_operation_limit: 15    # 连续操作次数上限；0 关闭连续休息
  session_rest_min_seconds: 120  # 连续操作后自动休息时长（秒）
  session_rest_max_seconds: 300
  network_retry_jitter_seconds: 30 # 网络失败退避额外随机等待上限（秒）
  shared_write_gap_seconds: 180  # 评论/账号动作/私信/发布之间的跨功能共享写间隔（秒）
  comment_min_gap_seconds: 300
  comment_hourly_cap: 6
  comment_daily_cap: 20
  social_min_gap_seconds: 480
  social_hourly_cap: 4
  social_daily_cap: 15
  dm_min_gap_seconds: 480
  dm_hourly_cap: 4
  dm_daily_cap: 15
  publish_min_gap_seconds: 3600
  publish_hourly_cap: 2
  publish_daily_cap: 5
  combined_action_hourly_cap: 6
  combined_action_daily_cap: 20
  cooldown_steps_seconds: [1800, 7200, 21600, 86400] # 30 分钟、2 小时、6 小时、24 小时
  recovery_successes: 3
  recovery_probe_gap_seconds: 600
  event_retention_days: 30
  network_group_risk_accounts: 2 # 同出口多少个 native 账号同时命中风险后熔断（0 关闭）
  network_group_risk_window_seconds: 900
  network_group_cooldown_seconds: 7200

storage:
  db_path: ./data/creatorhub.db

# 日志与问题排查：默认精简记录关键状态、写操作与异常，不刷屏高频轮询请求，自动滚动限容与脱敏。
# 也可直接在「设置 → 日志与诊断」查看日志、临时切换调试级别或一键导出脱敏诊断包。
logging:
  level: info                 # info=精简排障(推荐) | debug=详细协议/页面诊断 | warning=仅告警与错误
  dir: ./logs                 # 日志目录(app.log 常规运行日志 + error.log 告警与异常日志)
  max_bytes: 5242880          # app.log 单文件上限(5 MB)，自动滚动保留最近 4 份
  backup_count: 4
  slow_request_ms: 3000       # 接口耗时超过该毫秒数时自动记录慢请求告警(0=关闭)

# 代理池:建号或批量配代理时优先分配同地区空闲节点,同区余量不足时按最少占用均衡复用(自动跳过反方向地区节点防错配),并高亮提醒共用风险。
# 推荐尽量使用住宅/4G 长效独立代理(一号一固定 IP,国内平台配大陆节点、海外平台配境外节点),降低同 IP 矩阵关联限流概率。
# 支持 http / https / socks5(自动升级 socks5h 远程 DNS 解析),可带账号密码;也可留空使用本机直连。
proxies: []
  # - http://user:pass@gateway.example.com:8000
  # - socks5://user:pass@1.2.3.4:1080
