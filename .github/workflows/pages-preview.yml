name: Deploy online preview and guide

on:
  push:
    branches: [main]
    paths:
      - "app/web/**"
      - "assets/screenshots/**"
      - "guide/**"
      - "preview/**"
      - "tests/test_guide_site.py"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate public guide
        run: python -m unittest discover -s tests -p test_guide_site.py
      - name: Build static demo and guide
        run: python preview/build_preview.py _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
